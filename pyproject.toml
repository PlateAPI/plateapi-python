[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plateapi"
version = "0.2.0"
description = "Python SDK for PlateAPI -- Australian vehicle registration plate lookup"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "WolfStack Solutions", email = "support@plateapi.com.au"},
]
keywords = ["plateapi", "rego", "vehicle", "registration", "australia", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.20.0",
]

[project.urls]
Homepage = "https://plateapi.com.au"
Documentation = "https://plateapi.com.au/docs/"
Repository = "https://github.com/PlateAPI/plateapi-python"
Changelog = "https://github.com/PlateAPI/plateapi-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/PlateAPI/plateapi-python/issues"

[tool.setuptools.packages.find]
include = ["plateapi*"]

[tool.setuptools.package-data]
plateapi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
